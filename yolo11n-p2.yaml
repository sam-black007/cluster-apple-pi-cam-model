# ==============================================================================
# YOLO11n-P2 Architecture Configuration
# Nano-scale YOLO11 with stride-4 (P2) small-object detection head for tiny drones.
#
# Classes: 0 = drone, 1 = bird
# Scales:
#   P2  stride 4  -> tiny targets 10-25 px (distant micro-drones 50-150m)
#   P3  stride 8  -> small targets
#   P4  stride 16 -> medium targets
#   P5  stride 32 -> large / close-range targets
# ==============================================================================

nc: 2  # 0: drone, 1: bird

scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]  # nano: ultra-fast for Raspberry Pi 5 & laptop CPU

# ------------------------------------------------------------------------------
# Backbone: stride-4 P2 high-resolution stem + darknet blocks
# ------------------------------------------------------------------------------
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]     # 0  P1/2  stem downsampling
  - [-1, 1, Conv, [128, 3, 2]]    # 1  P2/4  stride-4 high-res stem
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2  P2 feature extraction (stride 4)
  - [-1, 1, Conv, [256, 3, 2]]    # 3  P3/8  stride 8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4  P3 feature extraction (stride 8)
  - [-1, 1, Conv, [512, 3, 2]]    # 5  P4/16 stride 16
  - [-1, 2, C3k2, [512, True]]    # 6  P4 feature extraction (stride 16)
  - [-1, 1, Conv, [1024, 3, 2]]   # 7  P5/32 stride 32
  - [-1, 2, C3k2, [1024, True]]   # 8  P5 feature extraction (stride 32)
  - [-1, 1, SPPF, [1024, 5]]      # 9  Spatial Pyramid Pooling Fast

# ------------------------------------------------------------------------------
# Head: FPN-style upsampled neck + stride-4 P2 detection head for tiny objects
# ------------------------------------------------------------------------------
head:
  # Upsample P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11  cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 12

  # Upsample P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14  cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 15

  # Upsample P3 -> P2 (stride 4: 160x160 for small distant drones)
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 16
  - [[-1, 2], 1, Concat, [1]]                    # 17  cat backbone P2 (stride 4)
  - [-1, 2, C3k2, [128, False]]                  # 18  P2/4 feature map (tiny targets)

  # Downsample P2 -> P3
  - [-1, 1, Conv, [128, 3, 2]]                   # 19
  - [[-1, 15], 1, Concat, [1]]                   # 20  cat head P3
  - [-1, 2, C3k2, [256, False]]                  # 21

  # Downsample P3 -> P4
  - [-1, 1, Conv, [256, 3, 2]]                   # 22
  - [[-1, 12], 1, Concat, [1]]                   # 23  cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 24

  # Downsample P4 -> P5
  - [-1, 1, Conv, [512, 3, 2]]                   # 25
  - [[-1, 9], 1, Concat, [1]]                    # 26  cat head P5
  - [-1, 2, C3k2, [1024, True]]                  # 27

  # 4-Scale Detection Head [P2, P3, P4, P5]
  - [[18, 21, 24, 27], 1, Detect, [nc]]          # 28 Detect(P2, P3, P4, P5)
